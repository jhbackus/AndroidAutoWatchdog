        CheckBox skipCb=new CheckBox(this);
        skipCb.setText("Hele dag overslaan? (afwezig)");
        skipCb.setChecked(isWholeDaySkipped(date));
        box.addView(skipCb);

        Runnable updateEnabled=()->{
            boolean enabled=!skipCb.isChecked();
            breakfastCb.setEnabled(enabled); lunchCb.setEnabled(enabled); dinnerCb.setEnabled(enabled);
            breakfastCb.setAlpha(enabled?1f:0.45f); lunchCb.setAlpha(enabled?1f:0.45f); dinnerCb.setAlpha(enabled?1f:0.45f);
        };
        skipCb.setOnCheckedChangeListener((b,checked)->updateEnabled.run());
        updateEnabled.run();

        new AlertDialog.Builder(this)
                .setTitle("Dag bewerken • "+date.format(DateTimeFormatter.ofPattern("EEE d MMM")))
                .setView(box)
                .setPositiveButton("Opslaan",(d,w)->{
                    prefs.edit()
                            .putBoolean(mealEnabledKey(date,"breakfast"),breakfastCb.isChecked())
                            .putBoolean(mealEnabledKey(date,"lunch"),lunchCb.isChecked())
                            .putBoolean(mealEnabledKey(date,"dinner"),dinnerCb.isChecked())
                            .putBoolean(wholeDaySkipKey(date),skipCb.isChecked())
                            .commit();
                    showWeek();
                })
                .setNegativeButton("Annuleren",null)
                .show();
    }


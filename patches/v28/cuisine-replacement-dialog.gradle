def m = mainFile.getText('UTF-8')

// Replace the inline replacement listener with a cuisine selection dialog.
def replacementPattern = ~/(?s)        Button replace=secondary\("↻  Vervang dit gerecht"\);\n        replace\.setOnClickListener\(v->\{.*?\n        \}\);\n        content\.addView\(replace\);/
def matcher = replacementPattern.matcher(m)
if(!matcher.find()) throw new GradleException('v2.8: replacement button block not found')

def replacementBlock = '''        Button replace=secondary("↻  Vervang dit gerecht");
        replace.setOnClickListener(v->showCuisineReplacementDialog(m));
        content.addView(replace);'''
m = matcher.replaceFirst(java.util.regex.Matcher.quoteReplacement(replacementBlock))

// Insert the popup + context-aware replacement helper before groceries.
m = m.replace('''    private void showGroceries() {''', '''    private void showCuisineReplacementDialog(PlannerEngine.Meal meal){
        final String[] cuisines={
                "Random","Nederlands","Italiaans","Grieks","Spaans","Frans","Mexicaans","Indiaas",
                "Indonesisch","Thais","Vietnamees","Japans","Koreaans","Chinees","Marokkaans","Turks","Libanees","Mediterraan"
        };
        final int[] selected={0};
        AlertDialog dlg=new AlertDialog.Builder(this)
                .setTitle("Uit welke keuken?")
                .setSingleChoiceItems(cuisines,0,(d,which)->selected[0]=which)
                .setPositiveButton("Vervangen",null)
                .setNegativeButton("Annuleren",null)
                .create();
        dlg.setOnShowListener(x->dlg.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v->{
            String cuisine=cuisines[selected[0]];
            replaceMealWithCuisine(meal,cuisine);
            dlg.dismiss();
        }));
        dlg.show();
    }

    private void replaceMealWithCuisine(PlannerEngine.Meal meal,String cuisine){
        List<PlannerEngine.Meal> activeMeals=new ArrayList<>();
        for(PlannerEngine.Meal x:currentWeek){
            if(!isWholeDaySkipped(x.date) && isMealEnabled(x.date,"dinner")) activeMeals.add(x);
        }
        int maxMin=prefs.getInt("cook",35);
        Set<String> banned=new LinkedHashSet<>();
        String bannedRaw=prefs.getString("banned","");
        for(String x:bannedRaw.split(",")) if(!x.trim().isEmpty()) banned.add(x.trim());

        String histKey="replacement_history_"+meal.date.toString();
        Set<String> history=new LinkedHashSet<>();
        String histRaw=prefs.getString(histKey,"");
        if(!histRaw.isEmpty()) Collections.addAll(history,histRaw.split("\\u001F",-1));
        history.add(meal.title);

        PlannerEngine.Meal replacement=planner.replaceMeal(
                meal.date,meal,activeMeals,banned,maxMin,
                prefs.getString("diet_style","Gezond & gevarieerd"),
                household.nutritionFlags(),prefs.getString("favourites",""),
                prefs.getInt("menu_variant",0)+history.size(),history,cuisine);

        if(replacement==meal || replacement.title.equals(meal.title)){
            // Keep the cuisine constraint but reset only this date's history when that cuisine is exhausted.
            history.clear();
            history.add(meal.title);
            replacement=planner.replaceMeal(
                    meal.date,meal,activeMeals,banned,maxMin,
                    prefs.getString("diet_style","Gezond & gevarieerd"),
                    household.nutritionFlags(),prefs.getString("favourites",""),
                    prefs.getInt("menu_variant",0)+97,history,cuisine);
        }

        if(replacement==meal || replacement.title.equals(meal.title)){
            Toast.makeText(this,"Geen ander passend gerecht gevonden binnen "+cuisine,Toast.LENGTH_LONG).show();
            return;
        }

        history.add(replacement.title);
        prefs.edit().putString(histKey,android.text.TextUtils.join("\\u001F",history)).apply();
        for(int i=0;i<currentWeek.size();i++){
            if(currentWeek.get(i).date.equals(meal.date)){ currentWeek.set(i,replacement); break; }
        }
        showWeek();
    }

    private void showGroceries() {''')

if(!m.contains('Uit welke keuken?') || !m.contains('showCuisineReplacementDialog') || !m.contains('history,cuisine')) {

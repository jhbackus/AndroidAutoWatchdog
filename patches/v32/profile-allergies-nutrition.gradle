h=h.replace('''    private int scheduleIndex(LocalDate date) {''','''    public Set<String> familyAllergyBans(){
        Set<String> out=new LinkedHashSet<>();
        for(Person p:people){
            if(!"Hele gezin".equals(p.allergyScope)) continue;
            for(String a:p.allergies) addAllergyBans(out,a);
            if(p.allergyOther!=null && !p.allergyOther.trim().isEmpty()) out.add(p.allergyOther.trim());
        }
        return out;
    }

    public List<Person> personalAllergyPeople(){
        List<Person> out=new ArrayList<>();
        for(Person p:people) if("Persoonlijk".equals(p.allergyScope) && (!p.allergies.isEmpty() || (p.allergyOther!=null&&!p.allergyOther.trim().isEmpty()))) out.add(p);
        return out;
    }

    private static void addAllergyBans(Set<String> out,String allergy){
        String a=allergy.toLowerCase(Locale.ROOT);
        if(a.contains("noten")||a.contains("pinda")) Collections.addAll(out,"noten","pinda","pindakaas");
        else if(a.contains("lactose")||a.contains("melk")) Collections.addAll(out,"melk","yoghurt","kwark","kaas","room","feta","mozzarella","parmezaan");
        else if(a.contains("gluten")) Collections.addAll(out,"pasta","brood","wrap","couscous","bulgur","gnocchi");
        else if(a.contains("schaal")) Collections.addAll(out,"garnaal","garnalen","krab","kreeft","schaaldier");
        else if(a.equals("vis")) Collections.addAll(out,"zalm","kabeljauw","vis");
        else if(a.contains("ei")) out.add("ei");
        else if(a.contains("soja")) Collections.addAll(out,"soja","tofu");
        else if(a.contains("vlees")) Collections.addAll(out,"kip","rund","gehakt","eend","varken","lam","vlees");
        else out.add(allergy);
    }


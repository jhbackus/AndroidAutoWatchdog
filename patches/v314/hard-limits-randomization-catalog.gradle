// Enforce fixed-meal caps by substituting a deterministic lower-calorie meal when the configured fixed meal exceeds its cap.
// Dinner is already hard-filtered by PlannerEngine; the daily cap is converted to remaining dinner budget.
String capHelper='''    private String hardCappedFixedMeal(String meal,boolean breakfast){
        String adapted=adaptFixedMealForFamily(meal);
        int cap=prefs.getInt(breakfast?"max_cal_breakfast":"max_cal_lunch",0);
        if(cap<=0 || NutritionEstimator.estimateTextMeal(adapted,breakfast)<=cap) return adapted;
        String fallback=breakfast?"magere kwark, bessen":"volkoren brood, komkommer, tomaat";
        if(NutritionEstimator.estimateTextMeal(fallback,breakfast)<=cap) return fallback;
        return breakfast?"fruit":"groentesalade";
    }


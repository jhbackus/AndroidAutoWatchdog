name: Build AH Weekplanner APK

on:
  push:
    branches: [ ah-weekplanner-build ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ah-weekplanner-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack AH Weekplanner source
        run: |
          rm -rf AHWeekplanner-Android-v0.1
          unzip -q AHWeekplanner-Android-v0.1-source.zip
      - name: Build debug APK
        working-directory: AHWeekplanner-Android-v0.1
        run: gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=AHWeekplanner-Android-v0.1/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" AHWeekplanner-v0.1-debug.apk
          sha256sum AHWeekplanner-v0.1-debug.apk > AHWeekplanner-v0.1-debug.sha256
      - name: Publish APK back to build branch
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f AHWeekplanner-v0.1-debug.apk AHWeekplanner-v0.1-debug.sha256
          git commit -m 'CI artifact: AH Weekplanner v0.1 APK [skip ci]'
          git push origin HEAD:ah-weekplanner-build
      - uses: actions/upload-artifact@v4
        with:
          name: AHWeekplanner-v0.1-debug
          path: |
            AHWeekplanner-v0.1-debug.apk
            AHWeekplanner-v0.1-debug.sha256

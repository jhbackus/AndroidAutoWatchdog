// MT Food v2.7: make recipe preparation instructions more explicit and practical.
def ahProject = file("$buildDir/generated/ahweekplanner/AHWeekplanner-Android-v0.1")
def plannerFile = file("$ahProject/app/src/main/java/nl/weekplanner/ah/PlannerEngine.java")
if(!plannerFile.exists()) throw new GradleException('v2.7: generated PlannerEngine not found')

def s = plannerFile.getText('UTF-8')

// Expand the newer multi-step recipes with temperatures, timings and doneness cues.
s = s.replace('''"Meng citroenrasp, citroensap, oregano en olijfolie tot marinade.","Wrijf de kipdij in met de marinade en laat 10 minuten staan.","Verwarm de oven voor op 200 °C en snijd aardappel, courgette en ui.","Rooster de aardappel 15 minuten voor.","Voeg courgette, ui en kip toe en schep om met de achtergebleven marinade.","Rooster nog 20–25 minuten tot de kip gaar en de groenten goudbruin zijn.","Laat 3 minuten rusten en werk af met extra citroen."''', '''"Rasp de gele schil van de citroen fijn en pers de helft uit. Meng rasp en sap met oregano en olijfolie tot een marinade.","Dep de kipdij droog, wrijf rondom in met de marinade en laat minimaal 10 minuten staan; 30 minuten geeft meer smaak.","Verwarm de oven voor op 200 °C. Snijd de aardappelen in stukken van ongeveer 2 cm, de courgette in halve plakken en de ui in parten.","Verdeel alleen de aardappelen over een bakplaat, meng met een klein beetje olie en rooster 15 minuten zodat ze alvast garen.","Voeg courgette en ui toe. Leg de kip ertussen en verdeel de achtergebleven marinade over kip en groenten.","Rooster nog 20–25 minuten. De kip moet vanbinnen volledig gaar zijn en de aardappelen moeten makkelijk met een mes in te prikken zijn.","Haal uit de oven, laat de kip 3 minuten rusten en werk af met extra citroensap en eventueel wat verse oregano."''')

s = s.replace('''"Verwarm de oven voor op 210 °C en snijd aardappelen en paprika.","Meng het gehakt met komijn, paprikapoeder en de helft van de peterselie.","Vorm kleine köfte en zet ze koel terwijl de aardappelen 15 minuten voorroosteren.","Voeg paprika en köfte toe aan de bakplaat.","Rooster nog 15–18 minuten en keer de köfte halverwege.","Meng yoghurt met de rest van de peterselie en een klein scheutje water tot saus.","Serveer de köfte met aardappel, paprika en yoghurtsaus."''', '''"Verwarm de oven voor op 210 °C. Snijd de aardappelen in kleine parten en de paprika in grove repen.","Meng het gehakt met komijn, paprikapoeder en de helft van de fijngehakte peterselie. Kneed kort zodat het mengsel samenhangt maar niet compact wordt.","Vorm per persoon 3–4 kleine köfte. Zet ze even koel terwijl de aardappelen garen.","Meng de aardappelen met een beetje olie, verdeel over de bakplaat en rooster 15 minuten voor.","Voeg paprika en köfte toe. Rooster nog 15–18 minuten en keer de köfte halverwege zodat ze rondom kleuren.","Meng yoghurt met de rest van de peterselie en 1–2 theelepels water per persoon tot een lepelbare saus. Breng eventueel op smaak met een kneepje citroen.","Controleer of de köfte volledig gaar zijn en serveer ze met de geroosterde aardappel, paprika en yoghurtsaus."''')

s = s.replace('''"Meng de helft van de yoghurt met tandoorikruiden en marineer de kip minimaal 10 minuten.","Verwarm de oven voor op 210 °C.","Snijd aardappel klein en rooster 10 minuten voor.","Voeg bloemkool toe en rooster nog 5 minuten.","Leg de gemarineerde kip tussen de groenten en rooster nog 18–20 minuten.","Meng de rest van de yoghurt met citroensap.","Serveer met de frisse yoghurtdressing."''', '''"Meng de helft van de yoghurt met de tandoorikruiden. Dep de kip droog, schep door de marinade en laat minimaal 10 minuten staan; langer mag.","Verwarm de oven voor op 210 °C en bekleed eventueel een bakplaat met bakpapier.","Snijd de aardappelen in blokjes van ongeveer 2 cm, meng met een klein beetje olie en rooster 10 minuten voor.","Verdeel de bloemkool in kleine roosjes, voeg toe aan de aardappelen en rooster samen nog 5 minuten.","Leg de gemarineerde kip tussen de groenten en verdeel overtollige marinade dun over de kip. Rooster nog 18–20 minuten.","Meng ondertussen de resterende yoghurt met citroensap en eventueel een klein scheutje water tot een frisse dressing.","Controleer of de kip volledig gaar is en de aardappelen zacht zijn. Serveer direct met de yoghurtdressing ernaast."''')

s = s.replace('''"Bak de kipdij rondom bruin en haal tijdelijk uit de pan.","Fruit paprika met gerookt paprikapoeder.","Voeg tomaat en rijst toe en bak 1 minuut mee.","Schenk water erbij en leg de kip terug in de pan.","Laat zacht koken tot de rijst bijna gaar is.","Voeg doperwten toe voor de laatste 5 minuten.","Laat 3 minuten rusten en werk af met citroen."''', '''"Verhit een brede pan op middelhoog vuur. Bak de kipdij in een klein beetje olie 3–4 minuten per kant tot hij goed kleurt; hij hoeft nog niet gaar te zijn. Haal uit de pan.","Voeg de paprika toe en bak 3 minuten. Strooi het gerookte paprikapoeder erover en bak 30 seconden mee zodat de geur vrijkomt.","Roer de tomatenblokjes en rijst erdoor en bak ongeveer 1 minuut mee terwijl je goed omschept.","Voeg water toe volgens de hoeveelheid die de rijst nodig heeft. Leg de kip terug in de pan en breng rustig aan de kook.","Zet het vuur laag, dek af en laat zacht koken tot de rijst bijna gaar is. Roer zo weinig mogelijk zodat de rijst niet papperig wordt.","Voeg de doperwten toe voor de laatste 5 minuten. Controleer daarna of zowel rijst als kip volledig gaar zijn.","Haal van het vuur, laat 3 minuten afgedekt rusten en werk vlak voor serveren af met citroensap."''')

s = s.replace('''"Kook de rijst en laat na het afgieten kort droogstomen.","Dep tofu droog, snijd in blokjes en bak rondom krokant.","Wok broccoli en wortel beetgaar.","Roer pindakaas, sojasaus, limoensap en een scheut warm water tot saus.","Schep de tofu door de helft van de saus.","Verdeel rijst, groenten en tofu over kommen en lepel de rest van de saus erover."''', '''"Kook de rijst volgens de verpakking. Giet indien nodig af en laat 5 minuten met de deksel op de pan droogstomen.","Dep de tofu goed droog met keukenpapier, snijd in blokjes van ongeveer 2 cm en bak in een hete koekenpan 8–10 minuten rondom goudbruin.","Snijd de broccoli klein en de wortel in dunne reepjes. Wok de groenten 5–7 minuten zodat ze gaar maar nog knapperig zijn.","Meng pindakaas, sojasaus en limoensap. Voeg beetje bij beetje warm water toe tot een gladde, schenkbare saus ontstaat.","Schep de krokante tofu door ongeveer de helft van de saus en verwarm nog 1 minuut zodat de saus eraan hecht.","Verdeel rijst, groenten en tofu over kommen. Lepel de resterende saus erover en serveer direct."''')

s = s.replace('''"Verwarm de oven voor op 200 °C.","Snijd courgette, aubergine en paprika in gelijke stukken.","Meng de groenten met olijfolie en Provençaalse kruiden.","Rooster 15 minuten.","Voeg tomatenblokjes en uitgelekte witte bonen toe.","Bak nog 18–20 minuten en schep halverwege om.","Laat kort rusten en serveer eventueel met volkoren brood."''', '''"Verwarm de oven voor op 200 °C en gebruik een ruime ovenschaal zodat de groenten kunnen roosteren in plaats van stomen.","Snijd courgette, aubergine en paprika in stukken van ongeveer 2 cm zodat ze ongeveer tegelijk gaar worden.","Meng de groenten met olijfolie en Provençaalse kruiden. Verdeel ze in één laag over de schaal.","Rooster 15 minuten tot de randen beginnen te kleuren.","Spoel de witte bonen af, laat goed uitlekken en voeg samen met de tomatenblokjes toe. Schep voorzichtig om.","Bak nog 18–20 minuten. Schep halverwege nog één keer om en controleer of de aubergine volledig zacht is.","Laat de ratatouille 3–5 minuten rusten zodat de smaken samenkomen. Serveer eventueel met volkoren brood."''')

if(!s.contains('De kip moet vanbinnen volledig gaar zijn') || !s.contains('brede pan op middelhoog vuur')) {
    throw new GradleException('v2.7 detailed instruction patch failed')
}
plannerFile.write(s,'UTF-8')

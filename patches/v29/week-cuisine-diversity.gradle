                    double s=score(r,target,diet,nutritionFlags,favourites,usedProteins)+rnd.nextDouble();''')

// Remember the cuisine after each normal selection.
p=p.replace('''                String mk=meatKey(best); if(mk!=null) meatCounts.put(mk,meatCounts.getOrDefault(mk,0)+1);''','''                String mk=meatKey(best); if(mk!=null) meatCounts.put(mk,meatCounts.getOrDefault(mk,0)+1);
                String ck=cuisineKey(best); if(ck!=null) usedCuisines.add(ck);''')

// Final fill must also prefer a cuisine that has not yet appeared.
p=p.replace('''                if(isFishRecipe(r) && fishCount>=2) continue;

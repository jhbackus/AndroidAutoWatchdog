name: Build Android Auto Watchdog APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack source
        run: unzip -q AndroidAutoWatchdog-source-v1.3.zip
      - name: Build debug APK
        working-directory: AndroidAutoKeeper
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidAutoWatchdog-v1.3-debug
          path: AndroidAutoKeeper/app/build/outputs/apk/debug/app-debug.apk

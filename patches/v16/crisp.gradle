    private List<String> crispProductNames(){
        ArrayList<String> out=new ArrayList<>();
        String raw=prefs.getString("crisp_products","''' + crispDefaults + '''");
        for(String x:raw.split(",")){String t=x.trim();if(!t.isEmpty())out.add(t);}
        return out;
    }

    private boolean isCrispProduct(String name){
        String n=name==null?"":name.trim().toLowerCase();
        for(String x:crispProductNames()) if(n.equals(x.toLowerCase())) return true;
        return false;
    }

    private void showCrispList(List<String> selected){
        StringBuilder sb=new StringBuilder();
        for(String s:selected) sb.append("• ").append(s).append("\n");
        new AlertDialog.Builder(this)
                .setTitle("Crisp-boodschappen")
                .setMessage(sb.toString().trim()+"\n\nCrisp biedt geen gedocumenteerde externe consumenten-API voor het rechtstreeks vullen van het mandje. MT Food opent daarom de officiële Crisp-app met deze aparte lijst klaar in MT Food.")
                .setPositiveButton("Open Crisp",(d,w)->openCrisp())
                .setNeutralButton("Kopieer lijst",(d,w)->{
                    android.content.ClipboardManager cm=(android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                    cm.setPrimaryClip(android.content.ClipData.newPlainText("Crisp boodschappen",sb.toString().trim()));
                    Toast.makeText(this,"Crisp-lijst gekopieerd",Toast.LENGTH_SHORT).show();
                })
                .setNegativeButton("Sluiten",null).show();
    }

    private void openCrisp(){
        try{
            Intent i=getPackageManager().getLaunchIntentForPackage("com.freshfoodventures.crisp");
            if(i!=null) startActivity(i); else startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse("https://crisp.nl/app")));
        }catch(Exception e){startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse("https://crisp.nl/app")));}
    }


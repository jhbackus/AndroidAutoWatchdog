plugins { id 'com.android.application' }

// MT Food v0.3: build from the verified v0.2 source and apply the AH 2026 client fix + branding.
def ahExtractDir = file("$buildDir/generated/ahweekplanner")
def chunkDir = rootProject.file('ah-source-v02')
def packed = chunkDir.listFiles().findAll { it.name.startsWith('chunk-') }.sort { it.name }.collect { it.text.trim() }.join('')
def zipFile = file("$buildDir/generated/AHWeekplanner-Android-v0.2-source.zip")
zipFile.parentFile.mkdirs()
zipFile.bytes = java.util.Base64.decoder.decode(packed)
copy {
    from zipTree(zipFile)
    into ahExtractDir
}
def ahProject = file("$ahExtractDir/AHWeekplanner-Android-v0.1")

// Patch AH client identity used by the current working 2026 mobile API implementation.
def ahClient = file("$ahProject/app/src/main/java/nl/weekplanner/ah/AhClient.java")
def ahText = ahClient.getText('UTF-8')
ahText = ahText.replace('client_id=appie&', 'client_id=appie-ios&')
ahText = ahText.replace('b.put("clientId","appie");', 'b.put("clientId","appie-ios");')
ahText = ahText.replace('public String testConnection()throws Exception{JSONObject j=request("GET",BASE+"/mobile-services/shoppinglist/v2/items",token(),null);', 'public String testConnection()throws Exception{JSONObject j=request("GET",BASE+"/mobile-services/lists/v3/lists?productId=1",token(),null);')
ahText = ahText.replace('c.setRequestProperty("User-Agent","Appie/8.63 Android");c.setRequestProperty("X-Application","AHWEBSHOP");', 'c.setRequestProperty("User-Agent","Appie/9.28 (iPhone17,3; iPhone; CPU OS 26_1 like Mac OS X)");c.setRequestProperty("x-client-name","appie-ios");c.setRequestProperty("x-client-version","9.28");c.setRequestProperty("x-application","AHWEBSHOP");')
ahClient.write(ahText, 'UTF-8')

// Branding: installed name MT Food + generated launcher icon + title inside the app.
copy {
    from rootProject.file('patches/v03/AndroidManifest.xml')
    into file("$ahProject/app/src/main")
}
def iconDir = file("$ahProject/app/src/main/res/drawable-nodpi")
iconDir.mkdirs()
def iconB64 = rootProject.file('patches/v03/ic_mt_food.jpg.b64').text.replaceAll('\\s','')
file("$iconDir/ic_mt_food.jpg").bytes = java.util.Base64.decoder.decode(iconB64)
def mainActivity = file("$ahProject/app/src/main/java/nl/weekplanner/ah/MainActivity.java")
def mainText = mainActivity.getText('UTF-8').replace('hero.addView(text("Weekplanner", 27, true, Color.WHITE));', 'hero.addView(text("MT Food", 27, true, Color.WHITE));')
mainActivity.write(mainText, 'UTF-8')

android {
    namespace 'nl.weekplanner.ah'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.weekplanner.ah'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    sourceSets {
        main {
            manifest.srcFile file("$ahProject/app/src/main/AndroidManifest.xml")
            java.srcDirs = [file("$ahProject/app/src/main/java")]
            res.srcDirs = [file("$ahProject/app/src/main/res")]
            aidl.srcDirs = []
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies { }

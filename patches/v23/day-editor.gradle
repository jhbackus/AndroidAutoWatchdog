// Add editor and persistent helpers before showRecipe.
s = s.replace('''    private void showRecipe(PlannerEngine.Meal m) {''', '''    private String mealEnabledKey(LocalDate date,String meal){ return "meal_enabled_"+meal+"_"+date.toString(); }

name: Build CAR AI APK

on:
  workflow_dispatch:
  push:
    branches: [ chatgpt-auto-v2 ]
    paths:
      - 'ChatGPT-Auto-v2/**'
      - '.github/workflows/build-chatgpt-auto-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAR_AI_BROKER_TOKEN: ${{ secrets.CAR_AI_BROKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ChatGPT-Auto-v2
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f ChatGPT-Auto-v2/app/build/outputs/apk/debug/app-debug.apk
          ls -lh ChatGPT-Auto-v2/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CAR-AI-v0.4.1-debug
          path: ChatGPT-Auto-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

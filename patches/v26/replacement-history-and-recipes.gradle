def m = mainFile.getText('UTF-8')

// Persist a per-date replacement history and exclude already-seen dishes on subsequent clicks.
m = m.replace('''            PlannerEngine.Meal replacement=planner.replaceMeal(
                    m.date,m,activeMeals,banned,maxMin,
                    prefs.getString("diet_style","Gezond & gevarieerd"),
                    household.nutritionFlags(),prefs.getString("favourites",""),
                    prefs.getInt("menu_variant",0)+1);
            for(int i=0;i<currentWeek.size();i++) if(currentWeek.get(i).date.equals(m.date)){ currentWeek.set(i,replacement); break; }
            showWeek();''', '''            String histKey="replacement_history_"+m.date.toString();
            Set<String> history=new LinkedHashSet<>();
            String histRaw=prefs.getString(histKey,"");
            if(!histRaw.isEmpty()) Collections.addAll(history,histRaw.split("\\u001F",-1));
            history.add(m.title);
            PlannerEngine.Meal replacement=planner.replaceMeal(
                    m.date,m,activeMeals,banned,maxMin,
                    prefs.getString("diet_style","Gezond & gevarieerd"),
                    household.nutritionFlags(),prefs.getString("favourites",""),
                    prefs.getInt("menu_variant",0)+history.size(),history);
            // Only after the valid pool is exhausted may earlier replacements be reconsidered.
            // Keep the current dish excluded so the button always changes something.
            if(replacement==m || replacement.title.equals(m.title)){
                history.clear();
                history.add(m.title);
                replacement=planner.replaceMeal(
                        m.date,m,activeMeals,banned,maxMin,
                        prefs.getString("diet_style","Gezond & gevarieerd"),
                        household.nutritionFlags(),prefs.getString("favourites",""),
                        prefs.getInt("menu_variant",0)+97,history);
            }
            history.add(replacement.title);
            prefs.edit().putString(histKey,android.text.TextUtils.join("\\u001F",history)).apply();
            for(int i=0;i<currentWeek.size();i++) if(currentWeek.get(i).date.equals(m.date)){ currentWeek.set(i,replacement); break; }
            showWeek();''')

// A completely regenerated week should start a fresh replacement cycle for its dates.
m = m.replace('''        generate.setOnClickListener(v->{currentWeek=generateWeek();showWeek();});''', '''        generate.setOnClickListener(v->{
            SharedPreferences.Editor ed=prefs.edit();
            for(int d=0;d<7;d++) ed.remove("replacement_history_"+currentMonday.plusDays(d).toString());
            ed.apply();
            currentWeek=generateWeek();showWeek();
        });''')

if(!m.contains('replacement_history_') || !m.contains('history.size(),history')) {

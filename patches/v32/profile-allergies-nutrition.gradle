            if(heightCm<=0 || weightKg<=0) return 0;
            double m=heightCm/100.0;
            return weightKg/(m*m);
        }

        public String allergySummary(){
            if(allergies.isEmpty() && (allergyOther==null || allergyOther.trim().isEmpty())) return "geen allergieën ingesteld";
            List<String> x=new ArrayList<>(allergies);
            if(allergyOther!=null && !allergyOther.trim().isEmpty()) x.add(allergyOther.trim());
            return android.text.TextUtils.join(", ",x)+" • "+allergyScope;
        }

        public String nutritionTargetsSummary(){
            boolean child="Kind".equals(type);
            boolean female="Vrouw".equals(type);
            double protein;
            if(weightKg>0) protein=Math.max(child?0.95:0.83,(age>=65 || muscle)?1.0:0.83)*weightKg;
            else protein=child?45: female?50:60;
            int fiber=child?Math.max(18,Math.min(30,age+10)):female?30:35;
            int calcium=(child && age>=10)?1200:(age>=50 || menopause || bone)?1200:1000;
            int iron=child?11:(female && age<50?16:11);
            int vitD=(age>=70)?20:10;
            String bmiText=bmi()>0?String.format(Locale.ROOT," • BMI %.1f",bmi()):"";
            return String.format(Locale.ROOT,"Richtwaarden: eiwit %.0f g • vezels %d g • calcium %d mg • ijzer %d mg • vit. D %d µg%s",protein,fiber,calcium,iron,vitD,bmiText);
        }

        public String healthSummary() {''')


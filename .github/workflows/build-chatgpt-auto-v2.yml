name: Build CAR AI APK

on:
  workflow_dispatch:
  push:
    branches: [ chatgpt-auto-v2 ]
    paths:
      - 'ChatGPT-Auto-v2/**'
      - '.github/workflows/build-chatgpt-auto-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAR_AI_BROKER_TOKEN: ${{ secrets.CAR_AI_BROKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild launcher PNG from validated text chunks
        run: |
          cat ChatGPT-Auto-v2/icon_chunks/*.part | tr -d '\n\r' | base64 -d > /tmp/car_ai_launcher.png
          echo '4875268de5f30472d03973b2eac2fc3423cced5e00d9caaabddccccf8f3f0198  /tmp/car_ai_launcher.png' | sha256sum -c -
          python3 - <<'PY'
          import struct, zlib
          p='/tmp/car_ai_launcher.png'
          data=open(p,'rb').read()
          assert data.startswith(b'\x89PNG\r\n\x1a\n')
          pos=8; iend=False
          while pos+12 <= len(data):
              n=struct.unpack('>I',data[pos:pos+4])[0]
              t=data[pos+4:pos+8]
              chunk=data[pos+8:pos+8+n]
              crc=struct.unpack('>I',data[pos+8+n:pos+12+n])[0]
              assert (zlib.crc32(t+chunk)&0xffffffff)==crc, (t, 'CRC')
              pos += 12+n
              if t == b'IEND': iend=True; break
          assert iend
          print('Source launcher PNG CRC verified')
          PY
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi nodpi; do
            mkdir -p "ChatGPT-Auto-v2/app/src/main/res/mipmap-$d"
            cp /tmp/car_ai_launcher.png "ChatGPT-Auto-v2/app/src/main/res/mipmap-$d/ic_launcher.png"
            rm -f "ChatGPT-Auto-v2/app/src/main/res/mipmap-$d/ic_launcher.webp"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ChatGPT-Auto-v2
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK, Android Auto declaration and launcher PNGs
        run: |
          APK='ChatGPT-Auto-v2/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          python3 - <<'PY'
          import struct, zipfile, zlib
          apk='ChatGPT-Auto-v2/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              icons=sorted(n for n in names if 'ic_launcher' in n and n.endswith('.png'))
              assert len(icons) >= 5, icons
              assert not any('ic_launcher.webp' in n for n in names)
              for name in icons:
                  data=z.read(name); assert data.startswith(b'\x89PNG\r\n\x1a\n'), name
                  pos=8; iend=False
                  while pos+12 <= len(data):
                      n=struct.unpack('>I',data[pos:pos+4])[0]
                      t=data[pos+4:pos+8]
                      chunk=data[pos+8:pos+8+n]
                      crc=struct.unpack('>I',data[pos+8+n:pos+12+n])[0]
                      assert (zlib.crc32(t+chunk)&0xffffffff)==crc, f'{name}: CRC {t!r}'
                      pos += 12+n
                      if t == b'IEND': iend=True; break
                  assert iend, name
              print('APK launcher PNGs verified:', icons)
          PY
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -E "package:|application-label:|application-icon-"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -E "CarAiMediaLibraryService|androidx.media3.session.MediaLibraryService|android.media.browse.MediaBrowserService|com.google.android.gms.car.application|TintableAttributionIcon"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: CAR-AI-v0.4.5-debug
          path: ChatGPT-Auto-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

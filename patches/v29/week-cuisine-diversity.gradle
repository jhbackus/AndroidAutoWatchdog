                extra=r; break;''')

p=p.replace('''            String mk=meatKey(extra); if(mk!=null) meatCounts.put(mk,meatCounts.getOrDefault(mk,0)+1);''','''            String mk=meatKey(extra); if(mk!=null) meatCounts.put(mk,meatCounts.getOrDefault(mk,0)+1);
            String ck=cuisineKey(extra); if(ck!=null) usedCuisines.add(ck);''')

// Add cuisine classification and feasibility helper before isFishRecipe.
p=p.replace('''    private static boolean isFishRecipe(Recipe r){''','''    private static String cuisineKey(Recipe r){
        String id=r.id.toLowerCase(Locale.ROOT);
        String title=r.title.toLowerCase(Locale.ROOT);
        Set<String> t=r.tags;
        if(t.contains("indonesian") || id.startsWith("indo-") || title.contains("indones")) return "Indonesisch";
        if(t.contains("thai") || id.startsWith("thai-") || title.contains("thai") || title.contains("thaise")) return "Thais";
        if(t.contains("vietnamese") || id.startsWith("vietnam-") || title.contains("vietnam")) return "Vietnamees";
        if(t.contains("japanese") || id.startsWith("japan-") || title.contains("japan") || title.contains("yakitori") || title.contains("teriyaki")) return "Japans";
        if(t.contains("korean") || id.startsWith("korean-") || title.contains("korea")) return "Koreaans";
        if(t.contains("chinese") || id.startsWith("china-") || title.contains("chinese") || title.contains("gemberkip") || title.contains("zoetzure")) return "Chinees";
        if(id.startsWith("greek-") || title.contains("griek")) return "Grieks";
        if(id.startsWith("spanish-") || title.contains("spaans")) return "Spaans";
        if(id.startsWith("french-") || title.contains("frans") || title.contains("ratatouille")) return "Frans";
        if(id.startsWith("mexican-") || title.contains("mexica") || title.contains("fajita") || title.contains("enchilada") || title.contains("wrap")) return "Mexicaans";
        if(id.startsWith("indian-") || title.contains("tandoori") || title.contains("madras")) return "Indiaas";
        if(id.startsWith("moroccan-") || title.contains("marokka")) return "Marokkaans";
        if(id.startsWith("turkish-") || title.contains("turk") || title.contains("köfte") || title.contains("kofte")) return "Turks";
        if(id.startsWith("lebanese-") || title.contains("libane") || title.contains("tabouleh") || title.contains("shawarma")) return "Libanees";
        if(id.startsWith("italian-") || title.contains("pasta") || title.contains("bolognese") || title.contains("pesto") || title.contains("gnocchi") || title.contains("lasagne") || title.contains("lasagna")) return "Italiaans";
        if(title.contains("curry") && !t.contains("thai")) return "Indiaas";
        if(t.contains("med")) return "Mediterraan";
        if(r.category.equals("AVG")) return "Nederlands/Europees";
        return "Internationaal";
    }

    private static boolean hasUnusedCuisineCandidate(List<Recipe> allowed,Set<String> usedIds,Set<String> usedCuisines,
                                                     int fishCount,Map<String,Integer> meatCounts){
        for(Recipe x:allowed){
            if(usedIds.contains(x.id)) continue;
            if(isFishRecipe(x) && fishCount>=2) continue;
            String mk=meatKey(x);
            if(mk!=null && meatCounts.getOrDefault(mk,0)>=1) continue;
            String ck=cuisineKey(x);
            if(ck!=null && !usedCuisines.contains(ck)) return true;
        }
        return false;
    }

    private static boolean isFishRecipe(Recipe r){''')

if(!p.contains('usedCuisines') || !p.contains('hasUnusedCuisineCandidate') || !p.contains('private static String cuisineKey')) {

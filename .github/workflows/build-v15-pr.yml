name: Verify v1.5 signed APK
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        run: gradle assembleRelease --stacktrace
      - name: Recover signing material from previous trusted artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9477190082/zip -o signing.zip
          mkdir signing
          unzip -q signing.zip -d signing
      - name: Sign and verify APK
        run: |
          PASS=$(cat signing/keystore-password.txt)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks signing/android-auto-watchdog-release.p12 --ks-type PKCS12 --ks-key-alias androidautowatchdog --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out AndroidAutoWatchdog-v1.5-final.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs AndroidAutoWatchdog-v1.5-final.apk | tee signing-verification-v1.5.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidAutoWatchdog-v1.5-final
          path: |
            AndroidAutoWatchdog-v1.5-final.apk
            signing-verification-v1.5.txt

name: Build CAR AI APK

on:
  workflow_dispatch:
  push:
    branches: [ chatgpt-auto-v2 ]
    paths:
      - 'ChatGPT-Auto-v2/**'
      - '.github/workflows/build-chatgpt-auto-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAR_AI_BROKER_TOKEN: ${{ secrets.CAR_AI_BROKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild launcher PNG from validated text chunks
        run: |
          cat ChatGPT-Auto-v2/icon_chunks/*.part | tr -d '\n\r' | base64 -d > /tmp/car_ai_launcher.png
          echo '4875268de5f30472d03973b2eac2fc3423cced5e00d9caaabddccccf8f3f0198  /tmp/car_ai_launcher.png' | sha256sum -c -
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi nodpi; do
            mkdir -p "ChatGPT-Auto-v2/app/src/main/res/mipmap-$d"
            cp /tmp/car_ai_launcher.png "ChatGPT-Auto-v2/app/src/main/res/mipmap-$d/ic_launcher.png"
            rm -f "ChatGPT-Auto-v2/app/src/main/res/mipmap-$d/ic_launcher.webp"
          done

      - name: Restore stable CAR AI signing key
        run: |
          base64 -d ChatGPT-Auto-v2/signing/car-ai-release-fixed.jks.b64 > ChatGPT-Auto-v2/signing/car-ai-release-fixed.jks
          keytool -list -keystore ChatGPT-Auto-v2/signing/car-ai-release-fixed.jks -storepass 'CarAiUpdate2026!' -alias carai >/dev/null

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build CAR AI APK
        working-directory: ChatGPT-Auto-v2
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK, voice CarAppService, broker config and signature
        run: |
          APK='ChatGPT-Auto-v2/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep "package: name='nl.carai.androidauto'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep 'ChatGptCarAppService'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep 'androidx.car.app.CarAppService'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep 'androidx.car.app.category.IOT'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep 'com.google.android.gms.car.application'
          unzip -p "$APK" resources.arsc >/dev/null
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: CAR-AI-v0.5.0-voice
          path: ChatGPT-Auto-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

        LinearLayout box=new LinearLayout(this);
        box.setOrientation(LinearLayout.VERTICAL);
        box.setPadding(dp(20),dp(8),dp(20),dp(8));

        CheckBox breakfastCb=new CheckBox(this);
        breakfastCb.setText("Ontbijt");
        breakfastCb.setChecked(isMealEnabled(date,"breakfast"));
        box.addView(breakfastCb);

        CheckBox lunchCb=new CheckBox(this);
        lunchCb.setText("Lunch");
        lunchCb.setChecked(isMealEnabled(date,"lunch"));
        box.addView(lunchCb);

        CheckBox dinnerCb=new CheckBox(this);
        dinnerCb.setText("Avondeten");
        dinnerCb.setChecked(isMealEnabled(date,"dinner"));
        box.addView(dinnerCb);

        Space gap=new Space(this);

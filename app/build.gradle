plugins { id 'com.android.application' }

// MT Food v0.6: current AH login/client identity + test on the same v2 shopping-list API used for writes.
def ahExtractDir = file("$buildDir/generated/ahweekplanner")
def chunkDir = rootProject.file('ah-source-v02')
def packed = chunkDir.listFiles().findAll { it.name.startsWith('chunk-') }.sort { it.name }.collect { it.text.trim() }.join('')
def zipFile = file("$buildDir/generated/AHWeekplanner-Android-v0.2-source.zip")
zipFile.parentFile.mkdirs()
zipFile.bytes = java.util.Base64.decoder.decode(packed)
copy {
    from zipTree(zipFile)
    into ahExtractDir
}
def ahProject = file("$ahExtractDir/AHWeekplanner-Android-v0.1")

def ahClient = file("$ahProject/app/src/main/java/nl/weekplanner/ah/AhClient.java")
def ahText = ahClient.getText('UTF-8')
// Current AH login endpoint + iOS mobile client identity.
ahText = ahText.replace('https://login.ah.nl/secure/oauth/authorize', 'https://login.ah.nl/login')
ahText = ahText.replace('?client_id=appie"', '?client_id=appie-ios"')
ahText = ahText.replace('body.put("clientId", "appie");', 'body.put("clientId", "appie-ios");')
// Test the authenticated standard shopping-list endpoint, not favorite-lists v3.
ahText = ahText.replace('requestJson("GET", BASE + "/mobile-services/shoppinglist/v2/items?orderBy=userInput&orderByParam=0", token, null);', 'requestJson("GET", BASE + "/mobile-services/shoppinglist/v2/items", token, null);')
// Write to the same current endpoint without obsolete query params.
ahText = ahText.replace('BASE + "/mobile-services/shoppinglist/v2/items?orderBy=userInput&orderByParam=0",', 'BASE + "/mobile-services/shoppinglist/v2/items",')
ahText = ahText.replace('conn.setRequestProperty("User-Agent", "Appie/8.63 Android");\n        conn.setRequestProperty("X-Application", "AHWEBSHOP");', 'conn.setRequestProperty("User-Agent", "Appie/9.28 (iPhone17,3; iPhone; CPU OS 26_1 like Mac OS X)");\n        conn.setRequestProperty("x-client-name", "appie-ios");\n        conn.setRequestProperty("x-client-version", "9.28");\n        conn.setRequestProperty("x-application", "AHWEBSHOP");')
if (ahText.contains('secure/oauth/authorize') || ahText.contains('client_id=appie"') || ahText.contains('"clientId", "appie"') || ahText.contains('Appie/8.63 Android') || ahText.contains('X-Application') || ahText.contains('/mobile-services/lists/v3/lists?productId=1')) {
    throw new GradleException('AH v0.6 patch incomplete: legacy/wrong endpoint still present')
}
if (!ahText.contains('https://login.ah.nl/login') || !ahText.contains('client_id=appie-ios') || !ahText.contains('"clientId", "appie-ios"') || !ahText.contains('x-client-name') || !ahText.contains('x-client-version') || !ahText.contains('/mobile-services/shoppinglist/v2/items')) {
    throw new GradleException('AH v0.6 patch validation failed')
}
ahClient.write(ahText, 'UTF-8')

copy {
    from rootProject.file('patches/v03/AndroidManifest.xml')
    into file("$ahProject/app/src/main")
}
def iconDir = file("$ahProject/app/src/main/res/drawable")
iconDir.mkdirs()
copy {
    from rootProject.file('patches/v03/ic_mt_food.xml')
    into iconDir
}
def mainActivity = file("$ahProject/app/src/main/java/nl/weekplanner/ah/MainActivity.java")
def mainText = mainActivity.getText('UTF-8').replace('hero.addView(text("Weekplanner", 27, true, Color.WHITE));', 'hero.addView(text("MT Food", 27, true, Color.WHITE));')
mainActivity.write(mainText, 'UTF-8')

android {
    namespace 'nl.weekplanner.ah'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.weekplanner.ah'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
    }

    sourceSets {
        main {
            manifest.srcFile file("$ahProject/app/src/main/AndroidManifest.xml")
            java.srcDirs = [file("$ahProject/app/src/main/java")]
            res.srcDirs = [file("$ahProject/app/src/main/res")]
            aidl.srcDirs = []
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies { }

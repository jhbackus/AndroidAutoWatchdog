int close=p.lastIndexOf("\n}")
if(close<0) throw new GradleException('v3.14 planner close missing')
p=p.substring(0,close)+"\n"+catalog+p.substring(close)

// A ban is a hard exclusion on every textual surface after any attempted substitution.
String hardBan='''    private static boolean containsHardBan(Recipe r,Set<String> banned){
        if(banned==null || banned.isEmpty()) return false;
        StringBuilder all=new StringBuilder(r.title).append(' ').append(r.description);
        for(Ingredient i:r.ingredients) all.append(' ').append(i.name);
        for(String step:r.steps) all.append(' ').append(step);
        String hay=all.toString().toLowerCase(Locale.ROOT);
        for(String raw:banned){
            String b=raw==null?"":raw.trim().toLowerCase(Locale.ROOT);
            if(!b.isEmpty() && hay.contains(b)) return true;
        }
        return false;
    }

'''
p=p.replace('    private boolean allowed(Recipe r,Set<String>banned,int maxMinutes,String diet){',hardBan+'    private boolean allowed(Recipe r,Set<String>banned,int maxMinutes,String diet){\n        if(containsHardBan(r,banned)) return false;')

// Remove score bias: after a uniformly chosen feasible cuisine, every feasible recipe in it gets an equal draw.
// This also applies to week generation and all replacement fallbacks.
p=p.replaceAll(/double s=score\(r,target,diet,nutritionFlags,favourites,usedProteins\)(?:\+rnd\.nextDouble\(\)\*14\.0)?;/,'double s=rnd.nextDouble();')

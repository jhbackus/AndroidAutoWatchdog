name: Build MT Food v1.6 Crisp

on:
  push:
    branches: [ah-weekplanner-v03-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply v1.5 hotfix and v1.6 Crisp patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          old='''mainText = mainText.replace('String breakfast=prefs.getString(\"breakfast\",\"yoghurt / kwark, havermout, blauwe bessen\");',\n        'String breakfast=breakfastForDate(m.date);')'''
          if old in s:
              new='''mainText = mainText.replace(''' + "'''" + '''        int dinnerCount=household.count(m.date,HouseholdManager.DINNER);\n        String breakfast=prefs.getString(\"breakfast\",\"yoghurt / kwark, havermout, blauwe bessen\");''' + "'''" + ''',\n''' + "'''" + '''        int dinnerCount=household.count(m.date,HouseholdManager.DINNER);\n        String breakfast=breakfastForDate(m.date);''' + "'''" + ''')'''
              s=s.replace(old,new)
          marker='dependencies { }'
          if marker not in s:
              raise SystemExit('build.gradle marker not found')
          s=s.replace(marker, "apply from: rootProject.file('patches/v16/crisp.gradle')\n\n"+marker)
          p.write_text(s)
      - name: Build MT Food v1.6 debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MT-Food-v1.6-Crisp-debug
          path: app/build/outputs/apk/debug/*.apk

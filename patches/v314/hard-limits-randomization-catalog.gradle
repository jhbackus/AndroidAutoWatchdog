            lunchPortions+=household.count(orderDate,HouseholdManager.LUNCH);
        }''')

// Scale every dinner ingredient by the number of people marked present on that exact even/odd-week date.
m=m.replace('private String adjustedAmountForAllergies(PlannerEngine.Meal meal,PlannerEngine.Ingredient ing){int total=household.count(meal.date,HouseholdManager.DINNER),conf=personalConflictCount(meal,ing);if(conf<=0)return ing.amount;int normal=Math.max(0,total-conf);return ing.amount+" × "+normal+" + alternatief × "+conf;}',
'''private String adjustedAmountForAllergies(PlannerEngine.Meal meal,PlannerEngine.Ingredient ing){
        int total=household.count(meal.date,HouseholdManager.DINNER),conf=personalConflictCount(meal,ing);
        int normal=Math.max(0,total-conf);
        if(conf<=0) return ing.amount+" × "+total;
        return ing.amount+" × "+normal+" + alternatief × "+conf;
    }''')

// One product per grocery row and per checkbox, even when a recipe stores a compound flavour line.
m=m.replace('all.putIfAbsent(ing.name,adjustedAmountForAllergies(m,ing));','addGroceryIngredientLines(all,m,ing);')
String groceryHelper='''    private void addGroceryIngredientLines(LinkedHashMap<String,String> all,PlannerEngine.Meal meal,PlannerEngine.Ingredient ing){
        String amount=adjustedAmountForAllergies(meal,ing);
        for(String raw:ing.name.split("\\\\s*,\\\\s*|\\\\s+en\\\\s+")){
            String product=raw.trim();
            if(!product.isEmpty()) all.putIfAbsent(product,amount);
        }
    }


name: Build AH Weekplanner APK

on:
  push:
    branches: [ ah-weekplanner-build ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ah-weekplanner-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack AH Weekplanner source
        run: |
          rm -rf AHWeekplanner-Android-v0.1
          unzip -q AHWeekplanner-Android-v0.1-source.zip
      - name: Build debug APK
        working-directory: AHWeekplanner-Android-v0.1
        run: gradle assembleDebug --stacktrace
      - name: Verify and split APK for connector retrieval
        run: |
          APK=AHWeekplanner-Android-v0.1/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" AHWeekplanner-v0.1-debug.apk
          sha256sum AHWeekplanner-v0.1-debug.apk > AHWeekplanner-v0.1-debug.sha256
          rm -rf ah-apk-b64
          mkdir ah-apk-b64
          base64 -w0 AHWeekplanner-v0.1-debug.apk > ah-apk-b64/all.b64
          split -b 6000 -d -a 3 ah-apk-b64/all.b64 ah-apk-b64/chunk-
          rm ah-apk-b64/all.b64
          COUNT=$(find ah-apk-b64 -type f -name 'chunk-*' | wc -l)
          SIZE=$(stat -c%s AHWeekplanner-v0.1-debug.apk)
          SHA=$(sha256sum AHWeekplanner-v0.1-debug.apk | awk '{print $1}')
          printf 'count=%s\nsize=%s\nsha256=%s\n' "$COUNT" "$SIZE" "$SHA" > ah-apk-b64/manifest.txt
      - name: Publish APK and retrieval chunks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f AHWeekplanner-v0.1-debug.apk AHWeekplanner-v0.1-debug.sha256 ah-apk-b64
          git commit -m 'CI artifact: AH Weekplanner v0.1 chunks [skip ci]'
          git push origin HEAD:ah-weekplanner-build
      - uses: actions/upload-artifact@v4
        with:
          name: AHWeekplanner-v0.1-debug
          path: |
            AHWeekplanner-v0.1-debug.apk
            AHWeekplanner-v0.1-debug.sha256

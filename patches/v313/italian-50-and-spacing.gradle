    private static Ingredient italianIngredient(String n){
        String x=n.toLowerCase(Locale.ROOT);
        String amount="naar smaak";
        boolean pantry=false;
        if(x.contains("pasta")||x.contains("spaghetti")||x.contains("linguine")||x.contains("tagliatelle")||x.contains("orecchiette")||x.contains("orzo")||x.contains("risottorijst")||x.contains("polenta")||x.contains("couscous")) amount="75–90 g p.p.";
        else if(x.contains("lasagnebladen")) amount="3–4 bladen p.p.";
        else if(x.contains("gnocchi")||x.contains("ravioli")||x.contains("tortellini")) amount="150–180 g p.p.";
        else if(x.contains("kip")||x.contains("zalm")||x.contains("kabeljauw")||x.contains("garnalen")||x.contains("kalfs")||x.contains("runder")||x.contains("varkens")||x.contains("carpaccio")||x.contains("tonijn")||x.contains("venusschelpen")) amount="140–160 g p.p.";
        else if(x.contains("ei")) amount="2 p.p.";
        else if(x.contains("mozzarella")||x.contains("ricotta")||x.contains("feta")||x.contains("geitenkaas")) amount="50–70 g p.p.";
        else if(x.contains("parmeza")) amount="15–25 g p.p.";
        else if(x.contains("passata")||x.contains("tomatenblokjes")) amount="140–160 ml p.p.";
        else if(x.contains("brood")||x.contains("ciabatta")||x.contains("focaccia")) amount="1 portie p.p.";
        else if(x.contains("aardappel")||x.contains("krieltjes")) amount="200–220 g p.p.";
        else if(x.contains("groente")||x.contains("courgette")||x.contains("aubergine")||x.contains("paprika")||x.contains("broccoli")||x.contains("spinazie")||x.contains("wortel")||x.contains("boerenkool")||x.contains("tomaat")||x.contains("komkommer")||x.contains("doperwten")||x.contains("champignon")||x.contains("oesterzwam")||x.contains("biet")) amount="100–180 g p.p.";
        else if(x.contains("bonen")) amount="120–150 g p.p.";
        else if(x.contains("olijfolie")||x.contains("basilicum")||x.contains("salie")||x.contains("citroen")||x.contains("kappertjes")||x.contains("olijven")||x.contains("chili")||x.contains("balsamico")) pantry=true;
        return new Ingredient(n,amount,pantry);
    }

    private static String italianTags(String title,String ingredients){
        String x=(title+" "+ingredients).toLowerCase(Locale.ROOT);
        String tags="balanced med italian vegetables ";
        if(x.contains("kip")) tags+="chicken protein ";
        if(x.contains("zalm")) tags+="fish salmon omega3 protein ";
        else if(x.contains("kabeljauw")||x.contains("tonijn")||x.contains("ansjovis")||x.contains("vongole")||x.contains("venusschelpen")||x.contains("garnalen")) tags+="fish protein ";
        if(x.contains("runder")||x.contains("kalf")||x.contains("carpaccio")) tags+="beef protein ";
        if(x.contains("ei")) tags+="egg protein ";
        if(!x.contains("kip")&&!x.contains("zalm")&&!x.contains("kabeljauw")&&!x.contains("tonijn")&&!x.contains("ansjovis")&&!x.contains("garnalen")&&!x.contains("vongole")&&!x.contains("venusschelpen")&&!x.contains("runder")&&!x.contains("kalf")&&!x.contains("carpaccio")&&!x.contains("pancetta")&&!x.contains("parmaham")) tags+="veg ";
        return tags.trim();
    }


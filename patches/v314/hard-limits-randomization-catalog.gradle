        int lunchPortions=household.totalMealPortions(currentMonday,HouseholdManager.LUNCH);''','''        int breakfastPortions=0, lunchPortions=0;
        for(int d=0;d<7;d++){
            LocalDate orderDate=currentMonday.plusDays(d);

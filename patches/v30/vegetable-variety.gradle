s=s.replace('if(mk!=null && meatCounts.getOrDefault(mk,0)>=1) continue;\n            double sc=score(', 'if(mk!=null && meatCounts.getOrDefault(mk,0)>=1) continue;\n            if(violatesVegetableLimits(r,vegetableCounts)) continue;\n            double sc=score(')

// Vegetable classification. Tomato, onion and garlic are intentionally exempt; paprika gets 3, all others 2.
def helpers='''    private static Set<String> vegetableKeys(Recipe r){
        Set<String> out=new LinkedHashSet<>();
        for(Ingredient i:r.ingredients){
            String n=i.name.toLowerCase(Locale.ROOT);
            if(n.contains("tomaat")||n.contains("tomaten")||n.contains("passata")||n.contains("ui")||n.contains("knoflook")) continue;
            if(n.contains("paprikapoeder")) continue;
            if(n.contains("paprika")) out.add("paprika");
            else if(n.contains("spinazie")) out.add("spinazie");
            else if(n.contains("broccoli")) out.add("broccoli");
            else if(n.contains("bloemkool")) out.add("bloemkool");
            else if(n.contains("courgette")) out.add("courgette");
            else if(n.contains("wortel")) out.add("wortel");
            else if(n.contains("sperziebon")) out.add("sperziebonen");
            else if(n.contains("aubergine")) out.add("aubergine");
            else if(n.contains("paksoi")) out.add("paksoi");
            else if(n.contains("prei")) out.add("prei");
            else if(n.contains("komkommer")) out.add("komkommer");
            else if(n.contains("doperwt")) out.add("doperwten");
            else if(n.contains("rodekool")) out.add("rodekool");
            else if(n.contains("venkel")) out.add("venkel");
            else if(n.contains("sla")) out.add("sla");
        }
        return out;
    }
    private static int vegetableLimit(String key){ return "paprika".equals(key)?3:2; }
    private static boolean violatesVegetableLimits(Recipe r,Map<String,Integer> counts){
        for(String k:vegetableKeys(r)) if(counts.getOrDefault(k,0)>=vegetableLimit(k)) return true;
        return false;
    }
    private static void addVegetableCounts(Recipe r,Map<String,Integer> counts){
        for(String k:vegetableKeys(r)) counts.put(k,counts.getOrDefault(k,0)+1);
    }

'''
s=s.replace('    private static String cuisineKey(Recipe r){', helpers+'    private static String cuisineKey(Recipe r){')
if(!s.contains('vegetableLimit(String key)')||!s.contains('addVegetableCounts(best,vegetableCounts)')) throw new GradleException('v3.0 vegetable patch failed')
f.write(s,'UTF-8')

plugins { id 'com.android.application' }

// MT Food v1.2: configurable household + scored, constraint-based recipe engine.
def ahExtractDir = file("$buildDir/generated/ahweekplanner")
def chunkDir = rootProject.file('ah-source-v02')
def packed = chunkDir.listFiles().findAll { it.name.startsWith('chunk-') }.sort { it.name }.collect { it.text.trim() }.join('')
def zipFile = file("$buildDir/generated/AHWeekplanner-Android-v0.2-source.zip")
zipFile.parentFile.mkdirs()
zipFile.bytes = java.util.Base64.decoder.decode(packed)
copy {
    from zipTree(zipFile)
    into ahExtractDir
}
def ahProject = file("$ahExtractDir/AHWeekplanner-Android-v0.1")

// Working AH integration.
copy {
    from rootProject.file('patches/v08/AhClient.java')
    into file("$ahProject/app/src/main/java/nl/weekplanner/ah")
}

// Configurable household/UI from v1.1.
copy {
    from rootProject.file('patches/v11/MainActivity.java')
    from rootProject.file('patches/v11/HouseholdManager.java')
    into file("$ahProject/app/src/main/java/nl/weekplanner/ah")
}

// Replace the old fixed planner with the v1.2 scoring/constraint engine.
copy {
    from rootProject.file('patches/v12/PlannerEngine.java')
    into file("$ahProject/app/src/main/java/nl/weekplanner/ah")
}

// Wire household flags, diet style and favourites into the new recipe engine.
def mainActivity = file("$ahProject/app/src/main/java/nl/weekplanner/ah/MainActivity.java")
def mainText = mainActivity.getText('UTF-8')
mainText = mainText.replace('private final Set<String> pantry = new LinkedHashSet<>();', 'private final Set<String> pantry = new LinkedHashSet<>();\n    private int menuVariant = 0;')
mainText = mainText.replace('return planner.makeWeek(currentMonday,banned,max);', 'return planner.makeWeek(currentMonday,banned,max,diet,household.nutritionFlags(),prefs.getString("favorites",""),menuVariant++);')
mainText = mainText.replace('Koppeling en veilige praktijktest • v1.1', 'Koppeling en veilige praktijktest • v1.2')
mainText = mainText.replace('Jullie complete eetweek • ontbijt, lunch en avondeten', 'Jullie complete eetweek • slim afgestemd op profielen')
if(!mainText.contains('household.nutritionFlags()') || !mainText.contains('menuVariant++')) throw new GradleException('v1.2 recipe-engine wiring failed')
mainActivity.write(mainText,'UTF-8')

// MT Food branding.
copy {
    from rootProject.file('patches/v03/AndroidManifest.xml')
    into file("$ahProject/app/src/main")
}
def iconDir = file("$ahProject/app/src/main/res/drawable")
iconDir.mkdirs()
copy {
    from rootProject.file('patches/v03/ic_mt_food.xml')
    into iconDir
}

android {
    namespace 'nl.weekplanner.ah'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.weekplanner.ah'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.2.0'
    }

    sourceSets {
        main {
            manifest.srcFile file("$ahProject/app/src/main/AndroidManifest.xml")
            java.srcDirs = [file("$ahProject/app/src/main/java")]
            res.srcDirs = [file("$ahProject/app/src/main/res")]
            aidl.srcDirs = []
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies { }

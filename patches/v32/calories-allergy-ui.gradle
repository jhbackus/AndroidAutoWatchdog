import java.util.*;
import java.util.regex.*;

public final class NutritionEstimator {
    private NutritionEstimator(){}

    public static int estimateRecipeCalories(List<PlannerEngine.Ingredient> ingredients){
        double total=0;
        for(PlannerEngine.Ingredient i:ingredients) total+=ingredientCalories(i.name,i.amount);
        return (int)Math.round(total/10.0)*10;
    }

    public static int estimateTextMeal(String text, boolean breakfast){
        if(text==null) return breakfast?300:400;
        String s=text.toLowerCase(Locale.ROOT); double c=0;
        if(s.contains("yoghurt")||s.contains("kwark")) c+=120;
        if(s.contains("havermout")) c+=150;
        if(s.contains("bessen")||s.contains("fruit")) c+=60;
        if(s.contains("brood")) c+=180;
        if(s.contains("ei")) c+=80;
        if(s.contains("hummus")) c+=70;
        if(s.contains("kaas")) c+=90;
        if(s.contains("noten")) c+=110;
        if(s.contains("pindakaas")) c+=100;
        if(s.contains("komkommer")||s.contains("tomaat")) c+=20;
        if(c<100) c=breakfast?300:400;
        return (int)Math.round(c/10.0)*10;
    }

    private static double ingredientCalories(String name,String amount){
        String n=name.toLowerCase(Locale.ROOT);
        double q=number(amount);
        boolean ml=amount.toLowerCase(Locale.ROOT).contains("ml");
        if(n.contains("olie")) return q>0?q*8.8:90;
        if(n.contains("pasta")||n.contains("rijst")||n.contains("couscous")||n.contains("bulgur")||n.contains("noedel")) return q>0?q*3.5:260;
        if(n.contains("gnocchi")) return q>0?q*1.5:270;
        if(n.contains("aardappel")||n.contains("krielt")) return q>0?q*0.8:175;
        if(n.contains("wrap")) return q>0?q*160:320;
        if(n.contains("brood")) return q>0?q*2.5:180;
        if(n.contains("zalm")) return q>0?q*2.1:300;
        if(n.contains("kabeljauw")||n.equals("vis")||n.contains("visfilet")) return q>0?q*0.9:150;
        if(n.contains("kip")||n.contains("rund")||n.contains("gehakt")||n.contains("eend")||n.contains("varken")||n.contains("lam")) return q>0?q*1.7:240;
        if(n.contains("tofu")) return q>0?q*1.25:190;
        if(n.contains("kikkererwt")||n.contains("bonen")||n.contains("linzen")) return q>0?q*1.2:150;
        if(n.equals("ei")||n.contains("eieren")) return q>0?q*80:80;
        if(n.contains("kaas")||n.contains("feta")||n.contains("mozzarella")||n.contains("roomkaas")||n.contains("parmeza")) return q>0?q*2.8:100;
        if(n.contains("yoghurt")||n.contains("kwark")||n.contains("melk")) return q>0?q*0.6:40;
        if(n.contains("pesto")) return q>0?q*4.5:90;
        if(n.contains("pinda")||n.contains("noten")) return q>0?q*6.0:120;
        if(n.contains("kokosmelk")) return q>0?q*1.3:130;
        if(n.contains("honing")) return q>0?q*3.0:25;
        if(n.contains("saus")||n.contains("ketjap")||n.contains("soja")) return q>0?q*0.8:25;
        if(n.contains("groente")||n.contains("broccoli")||n.contains("bloemkool")||n.contains("spinazie")||n.contains("courgette")||n.contains("paprika")||n.contains("wortel")||n.contains("aubergine")||n.contains("paksoi")||n.contains("tomaat")||n.contains("komkommer")||n.contains("prei")||n.contains("sla")) return q>0?q*0.3:40;
        if(ml && q>0) return q*0.5;
        return q>0?Math.min(100,q*0.4):15;
    }
    private static double number(String s){
        Matcher m=Pattern.compile("([0-9]+(?:[.,][0-9]+)?)").matcher(s==null?"":s);
        if(!m.find()) return 0;
        try{return Double.parseDouble(m.group(1).replace(',','.'));}catch(Exception e){return 0;}
    }
}

                    prefs.getInt("menu_variant",0)+1);
            for(int i=0;i<currentWeek.size();i++) if(currentWeek.get(i).date.equals(m.date)){ currentWeek.set(i,replacement); break; }
            showWeek();
        });''')

if(!m.contains('planner.replaceMeal(') || m.contains('replace.setOnClickListener(v->{currentWeek=generateWeek();showWeek();});')) {
    throw new GradleException('v2.5 replacement wiring failed')
}
mainFile.write(m,'UTF-8')

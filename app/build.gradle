plugins { id 'com.android.application' }

// MT Food v0.7: diagnose AH write security while keeping the working v0.6 GET/auth flow.
def ahExtractDir = file("$buildDir/generated/ahweekplanner")
def chunkDir = rootProject.file('ah-source-v02')
def packed = chunkDir.listFiles().findAll { it.name.startsWith('chunk-') }.sort { it.name }.collect { it.text.trim() }.join('')
def zipFile = file("$buildDir/generated/AHWeekplanner-Android-v0.2-source.zip")
zipFile.parentFile.mkdirs()
zipFile.bytes = java.util.Base64.decoder.decode(packed)
copy {
    from zipTree(zipFile)
    into ahExtractDir
}
def ahProject = file("$ahExtractDir/AHWeekplanner-Android-v0.1")

def ahClient = file("$ahProject/app/src/main/java/nl/weekplanner/ah/AhClient.java")
def ahText = ahClient.getText('UTF-8')
// Working AH login/client identity from v0.6.
ahText = ahText.replace('https://login.ah.nl/secure/oauth/authorize', 'https://login.ah.nl/login')
ahText = ahText.replace('?client_id=appie"', '?client_id=appie-ios"')
ahText = ahText.replace('body.put("clientId", "appie");', 'body.put("clientId", "appie-ios");')
ahText = ahText.replace('requestJson("GET", BASE + "/mobile-services/shoppinglist/v2/items?orderBy=userInput&orderByParam=0", token, null);', 'requestJson("GET", BASE + "/mobile-services/shoppinglist/v2/items", token, null);')
ahText = ahText.replace('BASE + "/mobile-services/shoppinglist/v2/items?orderBy=userInput&orderByParam=0",', 'BASE + "/mobile-services/shoppinglist/v2/items",')
ahText = ahText.replace('conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");', 'conn.setRequestProperty("Content-Type", "application/json");')
ahText = ahText.replace('conn.setRequestProperty("User-Agent", "Appie/8.63 Android");\n        conn.setRequestProperty("X-Application", "AHWEBSHOP");', 'conn.setRequestProperty("User-Agent", "Appie/9.28 (iPhone17,3; iPhone; CPU OS 26_1 like Mac OS X)");\n        conn.setRequestProperty("x-client-name", "appie-ios");\n        conn.setRequestProperty("x-client-version", "9.28");\n        conn.setRequestProperty("x-application", "AHWEBSHOP");')

// Match the current reference PATCH body more closely.
ahText = ahText.replace('JSONObject item = new JSONObject();\n            item.put("originCode", "PRD");', 'JSONObject item = new JSONObject();\n            item.put("description", "");\n            item.put("originCode", "PRD");')
ahText = ahText.replace('item.put("type", "SHOPPABLE");\n            items.put(item);', 'item.put("type", "SHOPPABLE");\n            item.put("strikeThrough", false);\n            items.put(item);')

// Capture any security/CSRF response header from the successful GET and replay it on PATCH.
ahText = ahText.replace('import java.util.List;', 'import java.util.List;\nimport java.util.LinkedHashMap;\nimport java.util.Map;')
ahText = ahText.replace('private final SharedPreferences prefs;', 'private final SharedPreferences prefs;\n    private final Map<String,String> securityHeaders = new LinkedHashMap<>();')
ahText = ahText.replace('if (bearer != null) conn.setRequestProperty("Authorization", "Bearer " + bearer);\n\n        if (body != null) {', 'if (bearer != null) conn.setRequestProperty("Authorization", "Bearer " + bearer);\n        if ("PATCH".equals(method)) {\n            for (Map.Entry<String,String> h : securityHeaders.entrySet()) conn.setRequestProperty(h.getKey(), h.getValue());\n        }\n\n        if (body != null) {')
ahText = ahText.replace('int code = conn.getResponseCode();\n        InputStream stream = (code >= 200 && code < 300) ? conn.getInputStream() : conn.getErrorStream();', 'int code = conn.getResponseCode();\n        if ("GET".equals(method) && endpoint.contains("/shoppinglist/v2/items")) {\n            securityHeaders.clear();\n            for (Map.Entry<String, List<String>> e : conn.getHeaderFields().entrySet()) {\n                String k = e.getKey();\n                if (k == null || e.getValue() == null || e.getValue().isEmpty()) continue;\n                String lk = k.toLowerCase();\n                if (lk.contains("security") || lk.contains("csrf") || lk.contains("xsrf")) securityHeaders.put(k, e.getValue().get(0));\n            }\n        }\n        InputStream stream = (code >= 200 && code < 300) ? conn.getInputStream() : conn.getErrorStream();')
ahText = ahText.replace('throw new RuntimeException("AH HTTP " + code + ": " + text);', 'String extra = securityHeaders.isEmpty() ? " | geen security/CSRF responseheader gezien" : " | doorgestuurde securityheaders: " + securityHeaders.keySet();\n            throw new RuntimeException("AH HTTP " + code + ": " + text + extra);')

if (ahText.contains('secure/oauth/authorize') || ahText.contains('client_id=appie"') || ahText.contains('"clientId", "appie"') || ahText.contains('Appie/8.63 Android') || ahText.contains('X-Application')) {
    throw new GradleException('AH v0.7 patch incomplete: legacy auth identity still present')
}
if (!ahText.contains('securityHeaders') || !ahText.contains('strikeThrough') || !ahText.contains('x-client-name') || !ahText.contains('/mobile-services/shoppinglist/v2/items')) {
    throw new GradleException('AH v0.7 diagnostic patch validation failed')
}
ahClient.write(ahText, 'UTF-8')

copy {
    from rootProject.file('patches/v03/AndroidManifest.xml')
    into file("$ahProject/app/src/main")
}
def iconDir = file("$ahProject/app/src/main/res/drawable")
iconDir.mkdirs()
copy {
    from rootProject.file('patches/v03/ic_mt_food.xml')
    into iconDir
}
def mainActivity = file("$ahProject/app/src/main/java/nl/weekplanner/ah/MainActivity.java")
def mainText = mainActivity.getText('UTF-8').replace('hero.addView(text("Weekplanner", 27, true, Color.WHITE));', 'hero.addView(text("MT Food", 27, true, Color.WHITE));')
mainActivity.write(mainText, 'UTF-8')

android {
    namespace 'nl.weekplanner.ah'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.weekplanner.ah'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7.0'
    }

    sourceSets {
        main {
            manifest.srcFile file("$ahProject/app/src/main/AndroidManifest.xml")
            java.srcDirs = [file("$ahProject/app/src/main/java")]
            res.srcDirs = [file("$ahProject/app/src/main/res")]
            aidl.srcDirs = []
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies { }

// MT Food v2.8: choose a cuisine before replacing a meal. Random is the default.
def ahProject = file("$buildDir/generated/ahweekplanner/AHWeekplanner-Android-v0.1")
def plannerFile = file("$ahProject/app/src/main/java/nl/weekplanner/ah/PlannerEngine.java")
def mainFile = file("$ahProject/app/src/main/java/nl/weekplanner/ah/MainActivity.java")
if(!plannerFile.exists() || !mainFile.exists()) throw new GradleException('v2.8: generated sources not found')

def p = plannerFile.getText('UTF-8')

// Extend contextual replacement with an optional cuisine filter.
p = p.replace('''    public Meal replaceMeal(LocalDate date, Meal oldMeal, List<Meal> activeOtherMeals,
                            Set<String> banned, int maxMinutes, String diet,
                            Set<String> nutritionFlags, String favourites, int variant,
                            Set<String> excludedTitles){''', '''    public Meal replaceMeal(LocalDate date, Meal oldMeal, List<Meal> activeOtherMeals,
                            Set<String> banned, int maxMinutes, String diet,
                            Set<String> nutritionFlags, String favourites, int variant,
                            Set<String> excludedTitles, String cuisine){''')

p = p.replace('''        for(Recipe r:allowedRecipes){
            if(oldMeal!=null && r.title.equals(oldMeal.title)) continue;
            if(usedTitles.contains(r.title)) continue;
            if(excludedTitles!=null && excludedTitles.contains(r.title)) continue;''', '''        for(Recipe r:allowedRecipes){
            if(oldMeal!=null && r.title.equals(oldMeal.title)) continue;
            if(usedTitles.contains(r.title)) continue;
            if(excludedTitles!=null && excludedTitles.contains(r.title)) continue;
            if(!matchesCuisine(r,cuisine)) continue;''')

p = p.replace('''    private static String proteinTag(Set<String>t){''', '''    private static boolean matchesCuisine(Recipe r,String cuisine){
        if(cuisine==null || cuisine.trim().isEmpty() || "Random".equals(cuisine)) return true;
        String c=cuisine.toLowerCase(Locale.ROOT);
        String id=r.id.toLowerCase(Locale.ROOT);
        String title=r.title.toLowerCase(Locale.ROOT);
        Set<String> t=r.tags;
        switch(c){
            case "indonesisch": return t.contains("indonesian") || id.startsWith("indo-") || title.contains("indones");
            case "thais": return t.contains("thai") || id.startsWith("thai-") || title.contains("thai") || title.contains("thaise");
            case "vietnamees": return t.contains("vietnamese") || id.startsWith("vietnam-") || title.contains("vietnam");
            case "japans": return t.contains("japanese") || id.startsWith("japan-") || title.contains("japan") || title.contains("yakitori") || title.contains("teriyaki");
            case "koreaans": return t.contains("korean") || id.startsWith("korean-") || title.contains("korea");
            case "chinees": return t.contains("chinese") || id.startsWith("china-") || title.contains("chinese") || title.contains("gemberkip") || title.contains("zoetzure");
            case "grieks": return id.startsWith("greek-") || title.contains("griek");
            case "spaans": return id.startsWith("spanish-") || title.contains("spaanse") || title.contains("spaans");
            case "frans": return id.startsWith("french-") || title.contains("franse") || title.contains("ratatouille");
            case "mexicaans": return id.startsWith("mexican-") || title.contains("mexica") || title.contains("fajita") || title.contains("enchilada") || title.contains("wrap");
            case "indiaas": return id.startsWith("indian-") || title.contains("tandoori") || title.contains("madras") || title.contains("curry");
            case "marokkaans": return id.startsWith("moroccan-") || title.contains("marokka");
            case "turks": return id.startsWith("turkish-") || title.contains("turk") || title.contains("köfte") || title.contains("kofte");
            case "libanees": return id.startsWith("lebanese-") || title.contains("libane") || title.contains("tabouleh") || title.contains("shawarma");
            case "italiaans": return id.startsWith("italian-") || title.contains("pasta") || title.contains("bolognese") || title.contains("pesto") || title.contains("gnocchi") || title.contains("lasagne") || title.contains("lasagna");
            case "mediterraan": return t.contains("med") || title.contains("mediterra");
            case "nederlands":
                return r.category.equals("AVG") && !t.contains("asian") && !id.startsWith("greek-") && !id.startsWith("spanish-") && !id.startsWith("moroccan-") && !id.startsWith("turkish-") && !id.startsWith("indian-");
            default: return true;
        }
    }

    private static String proteinTag(Set<String>t){''')

if(!p.contains('matchesCuisine(Recipe r,String cuisine)') || !p.contains('Set<String> excludedTitles, String cuisine')) {
    throw new GradleException('v2.8 planner cuisine patch failed')
}

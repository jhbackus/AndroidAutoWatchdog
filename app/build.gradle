plugins { id 'com.android.application' }

// Temporary build branch: unpack the AH Weekplanner source archive and compile it
// through the already-proven AndroidAutoWatchdog CI toolchain.
def ahExtractDir = file("$buildDir/generated/ahweekplanner")
copy {
    from zipTree(rootProject.file('AHWeekplanner-Android-v0.1-source.zip'))
    into ahExtractDir
}
def ahProject = file("$ahExtractDir/AHWeekplanner-Android-v0.1")

android {
    namespace 'nl.weekplanner.ah'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.weekplanner.ah'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main {
            manifest.srcFile file("$ahProject/app/src/main/AndroidManifest.xml")
            java.srcDirs = [file("$ahProject/app/src/main/java")]
            res.srcDirs = [file("$ahProject/app/src/main/res")]
            aidl.srcDirs = []
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies { }

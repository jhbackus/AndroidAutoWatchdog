// Helper methods for v1.5 and list normalization.
mainText = mainText.replace('private void loadPantry(){',
'''private void initV15Defaults(){
        if(!prefs.contains("breakfast_fruits")) prefs.edit().putString("breakfast_fruits","blauwe bessen, aardbeien, frambozen, kiwi, appel, peer, mandarijn").commit();
        if(!prefs.contains("daily_veg_shot")) prefs.edit().putBoolean("daily_veg_shot",true).commit();
        if(!prefs.getBoolean("v15_breakfast_migrated",false)){
            String raw=prefs.getString("breakfast","yoghurt / kwark, blauwe bessen");
            ArrayList<String> keep=new ArrayList<>();
            for(String x:raw.split(",")){
                String t=x.trim();
                if(t.equalsIgnoreCase("blauwe bessen") || t.equalsIgnoreCase("aardbeien") || t.equalsIgnoreCase("frambozen") || t.equalsIgnoreCase("kiwi") || t.equalsIgnoreCase("appel") || t.equalsIgnoreCase("peer") || t.equalsIgnoreCase("mandarijn")) continue;
                if(!t.isEmpty()) keep.add(t);
            }
            prefs.edit().putString("breakfast",android.text.TextUtils.join(", ",keep)).putBoolean("v15_breakfast_migrated",true).commit();
        }
    }

    private String breakfastFruitForDate(LocalDate date){
        String raw=normalizeList(prefs.getString("breakfast_fruits","blauwe bessen, aardbeien, frambozen, kiwi, appel, peer, mandarijn"));
        if(raw.isEmpty()) return "";
        String[] fruits=raw.split(",");
        return fruits[Math.floorMod(date.getDayOfYear(),fruits.length)].trim();
    }

    private String breakfastForDate(LocalDate date){
        String base=normalizeList(prefs.getString("breakfast","yoghurt / kwark"));
        String fruit=breakfastFruitForDate(date);
        String out=base;
        if(!fruit.isEmpty()) out+=(out.isEmpty()?"":" • ")+fruit;
        if(prefs.getBoolean("daily_veg_shot",true)){
            String shot=(date.getDayOfWeek().getValue()%2==1)?"AH groenteshot spinazie":"AH groenteshot wortel";
            out+=(out.isEmpty()?"":" • ")+shot;
        }
        return out;
    }

    private void addBreakfastFruitGroceries(LinkedHashMap<String,String> all){
        LinkedHashMap<String,Integer> counts=new LinkedHashMap<>();
        for(int d=0;d<7;d++){
            LocalDate date=currentMonday.plusDays(d);
            int n=household.count(date,HouseholdManager.BREAKFAST);
            if(n<=0) continue;
            String f=breakfastFruitForDate(date);
            if(!f.isEmpty()) counts.put(f,counts.getOrDefault(f,0)+n);
        }
        for(Map.Entry<String,Integer> e:counts.entrySet()) all.putIfAbsent(e.getKey(),"voor "+e.getValue()+" ontbijt-porties");
    }

    private String normalizeList(String raw){
        if(raw==null)return "";
        ArrayList<String> clean=new ArrayList<>();
        for(String x:raw.split(",")){
            String t=x.trim();
            if(!t.isEmpty())clean.add(t);
        }
        return android.text.TextUtils.join(", ",clean);
    }

    private void loadPantry(){''')

if(!mainText.contains('breakfast_fruits') || !mainText.contains('daily_veg_shot') || !mainText.contains('AH 85% Groenteshot spinazie') || !mainText.contains('breakfastForDate') || !mainText.contains('normalizeList')) {

    private View labeledSpinner(String label,Spinner s){LinearLayout b=card(CARD);b.addView(text(label,13,true,INK));b.addView(s);return b;}
    private int spinnerInt(Spinner s){try{return Integer.parseInt(String.valueOf(s.getSelectedItem()));}catch(Exception e){return 0;}}

    private String adaptFixedMealForFamily(String raw){
        if(raw==null)return ""; Set<String> bans=household.familyAllergyBans(); List<String> out=new ArrayList<>();
        for(String part:raw.split(",")){String item=part.trim(); if(item.isEmpty())continue; String low=item.toLowerCase(Locale.ROOT); boolean blocked=false; String hit="";
            for(String b:bans) if(low.contains(b.toLowerCase(Locale.ROOT))){blocked=true;hit=b.toLowerCase(Locale.ROOT);break;}
            if(!blocked){out.add(item);continue;}
            if(hit.contains("yogh")||hit.contains("melk")||hit.contains("kwark")) out.add("lactosevrije "+item);
            else if(hit.contains("brood")||hit.contains("pasta")||hit.contains("wrap")) out.add("glutenvrije "+item);
            else if(hit.contains("noten")||hit.contains("pinda")) out.add("zadenmix");
        }
        return android.text.TextUtils.join(", ",out);
    }

    private boolean personConflicts(HouseholdManager.Person p,String ingredient){
        String n=ingredient.toLowerCase(Locale.ROOT);
        for(String a:p.allergies){String x=a.toLowerCase(Locale.ROOT);
            if((x.contains("noten")||x.contains("pinda")) && (n.contains("noten")||n.contains("pinda")||n.contains("pesto"))) return true;
            if((x.contains("lactose")||x.contains("melk")) && (n.contains("melk")||n.contains("yogh")||n.contains("kwark")||n.contains("kaas")||n.contains("room")||n.contains("feta")||n.contains("mozzarella")||n.contains("parmeza"))) return true;
            if(x.contains("gluten") && (n.contains("pasta")||n.contains("brood")||n.contains("wrap")||n.contains("couscous")||n.contains("bulgur")||n.contains("gnocchi"))) return true;
            if(x.contains("schaal") && (n.contains("garna")||n.contains("krab")||n.contains("kreeft")||n.contains("schaaldier"))) return true;
            if(x.equals("vis") && (n.contains("zalm")||n.contains("kabeljauw")||n.contains("vis"))) return true;
            if(x.equals("ei") && (n.equals("ei")||n.contains("eieren"))) return true;
            if(x.contains("soja") && (n.contains("soja")||n.contains("tofu"))) return true;
            if(x.contains("vlees") && (n.contains("kip")||n.contains("rund")||n.contains("gehakt")||n.contains("eend")||n.contains("varken")||n.contains("lam")||n.contains("vlees"))) return true;
        }
        return p.allergyOther!=null&&!p.allergyOther.trim().isEmpty()&&n.contains(p.allergyOther.trim().toLowerCase(Locale.ROOT));
    }

    private int personalConflictCount(PlannerEngine.Meal meal,PlannerEngine.Ingredient ing){int c=0;for(HouseholdManager.Person p:household.personalAllergyPeople()) if(p.schedule[((meal.date.get(WeekFields.ISO.weekOfWeekBasedYear())%2==0)?7:0)+meal.date.getDayOfWeek().getValue()-1][HouseholdManager.DINNER]&&personConflicts(p,ing.name))c++;return c;}
    private String adjustedAmountForAllergies(PlannerEngine.Meal meal,PlannerEngine.Ingredient ing){int total=household.count(meal.date,HouseholdManager.DINNER),conf=personalConflictCount(meal,ing);if(conf<=0)return ing.amount;int normal=Math.max(0,total-conf);return ing.amount+" × "+normal+" + alternatief × "+conf;}

    private String personalAllergyNotes(PlannerEngine.Meal meal){
        List<String> notes=new ArrayList<>();
        for(HouseholdManager.Person p:household.personalAllergyPeople()){
            List<String> conflicts=new ArrayList<>(); for(PlannerEngine.Ingredient ing:meal.ingredients) if(personConflicts(p,ing.name)) conflicts.add(ing.name);
            if(conflicts.isEmpty())continue; String joined=android.text.TextUtils.join(", ",conflicts).toLowerCase(Locale.ROOT); String advice;
            if(joined.contains("noten")||joined.contains("pinda")||joined.contains("pesto")) advice="bereid de noten/pinda-garnering apart en zet los op tafel; voeg die niet toe aan de portie van "+p.name+".";
            else if(joined.contains("kip")||joined.contains("rund")||joined.contains("gehakt")||joined.contains("vlees")||joined.contains("eend")||joined.contains("lam")) advice="houd het vlees volledig apart en bereid voor "+p.name+" één aparte portie vis of een passende vegetarische eiwitbron.";
            else if(joined.contains("melk")||joined.contains("yogh")||joined.contains("kaas")||joined.contains("room")||joined.contains("feta")||joined.contains("mozzarella")) advice="houd de zuivelcomponent apart en gebruik voor "+p.name+" een lactose-/melkvrije variant.";
            else if(joined.contains("pasta")||joined.contains("brood")||joined.contains("wrap")||joined.contains("couscous")||joined.contains("bulgur")||joined.contains("gnocchi")) advice="bereid voor "+p.name+" een aparte glutenvrije portie en gebruik schoon keukengerei om kruiscontact te beperken.";
            else advice="bereid voor "+p.name+" een afzonderlijke veilige portie zonder "+android.text.TextUtils.join(", ",conflicts)+".";
            notes.add("• "+p.name+": "+advice);
        }
        return android.text.TextUtils.join("\\n",notes);
    }

    private Map<String,String> personalSubstitutes(PlannerEngine.Meal meal){
        Map<String,String> out=new LinkedHashMap<>();
        for(HouseholdManager.Person p:household.personalAllergyPeople()) for(PlannerEngine.Ingredient ing:meal.ingredients) if(personConflicts(p,ing.name)){
            String n=ing.name.toLowerCase(Locale.ROOT);
            if(n.contains("kip")||n.contains("rund")||n.contains("gehakt")||n.contains("eend")||n.contains("varken")||n.contains("lam")||n.contains("vlees")) out.put("visfilet of vegetarische eiwitbron","1 portie voor "+p.name);
            else if(n.contains("melk")||n.contains("yogh")||n.contains("kwark")||n.contains("kaas")||n.contains("room")||n.contains("feta")||n.contains("mozzarella")) out.put("lactose-/melkvrije variant van "+ing.name,"1 portie voor "+p.name);
            else if(n.contains("pasta")||n.contains("brood")||n.contains("wrap")||n.contains("couscous")||n.contains("bulgur")||n.contains("gnocchi")) out.put("glutenvrije variant van "+ing.name,"1 portie voor "+p.name);
            else if(!(n.contains("noten")||n.contains("pinda")||n.contains("pesto"))) out.put("veilig alternatief voor "+ing.name,"1 portie voor "+p.name);
        }
        return out;
    }


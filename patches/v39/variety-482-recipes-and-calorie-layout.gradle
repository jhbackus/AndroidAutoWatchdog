// Cuisine-first randomization: first choose a feasible cuisine for the day, then randomize/scoring within that cuisine.
String cuisineHelper='''    private static String pickRandomCuisineForSlot(List<Recipe> allowed,Set<String> usedIds,Set<String> usedCuisines,
                                                   int fishCount,Map<String,Integer> meatCounts,Map<String,Integer> vegetableCounts,
                                                   int slotMax,Random rnd){
        LinkedHashSet<String> unused=new LinkedHashSet<>();
        LinkedHashSet<String> all=new LinkedHashSet<>();
        for(Recipe r:allowed){
            if(usedIds.contains(r.id)) continue;
            if(slotMax>0 && activePrepMinutes(r)>slotMax) continue;
            if(isFishRecipe(r) && fishCount>=2) continue;
            String mk=meatKey(r); if(mk!=null && meatCounts.getOrDefault(mk,0)>=1) continue;
            if(violatesVegetableLimits(r,vegetableCounts)) continue;
            String ck=cuisineKey(r); if(ck==null) continue;
            all.add(ck); if(!usedCuisines.contains(ck)) unused.add(ck);
        }
        List<String> choices=new ArrayList<>(unused.isEmpty()?all:unused);
        if(choices.isEmpty()) return null;
        Collections.shuffle(choices,rnd);
        return choices.get(0);
    }


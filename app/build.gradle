android {
    namespace 'nl.weekplanner.ah'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.weekplanner.ah'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '1.4.0'
    }

    sourceSets {
        main {
            manifest.srcFile file("$ahProject/app/src/main/AndroidManifest.xml")
            java.srcDirs = [file("$ahProject/app/src/main/java")]
            res.srcDirs = [file("$ahProject/app/src/main/res")]
            aidl.srcDirs = []
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies { }

name: Build MT Food v1.6 Crisp signed

on:
  push:
    branches: [ah-weekplanner-v03-build]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v1.6 Crisp patch
        run: |
          printf '\napply from: rootProject.file("patches/v16/crisp.gradle")\n' >> app/build.gradle

      - name: Build unsigned release APK
        run: gradle assembleRelease --stacktrace

      - name: Restore fixed MT Food signing key
        env:
          GH_TOKEN: ${{ github.token }}
          MTFOOD_KEYSTORE_B64: ${{ secrets.MTFOOD_KEYSTORE_B64 }}
          MTFOOD_KEYSTORE_PASSWORD: ${{ secrets.MTFOOD_KEYSTORE_PASSWORD }}
          MTFOOD_KEY_ALIAS: ${{ secrets.MTFOOD_KEY_ALIAS }}
          MTFOOD_KEY_PASSWORD: ${{ secrets.MTFOOD_KEY_PASSWORD }}
        run: |
          if [ -n "$MTFOOD_KEYSTORE_B64" ]; then
            printf '%s' "$MTFOOD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mtfood-release.p12"
            printf '%s' "$MTFOOD_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks-pass"
            printf '%s' "$MTFOOD_KEY_PASSWORD" > "$RUNNER_TEMP/key-pass"
            printf '%s' "$MTFOOD_KEY_ALIAS" > "$RUNNER_TEMP/key-alias"
          else
            echo 'Permanent MTFOOD_* secrets are not configured yet; using the existing fixed trusted signing key.'
            curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9477190082/zip -o signing.zip
            mkdir signing
            unzip -q signing.zip -d signing
            cp signing/android-auto-watchdog-release.p12 "$RUNNER_TEMP/mtfood-release.p12"
            PASS=$(cat signing/keystore-password.txt)
            printf '%s' "$PASS" > "$RUNNER_TEMP/ks-pass"
            printf '%s' "$PASS" > "$RUNNER_TEMP/key-pass"
            printf '%s' 'androidautowatchdog' > "$RUNNER_TEMP/key-alias"
          fi

      - name: Sign and verify MT Food v1.6
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/mtfood-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$(cat "$RUNNER_TEMP/key-alias")" \
            --ks-pass "pass:$(cat "$RUNNER_TEMP/ks-pass")" \
            --key-pass "pass:$(cat "$RUNNER_TEMP/key-pass")" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out MT-Food-v1.6-Crisp-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs MT-Food-v1.6-Crisp-signed.apk | tee MT-Food-v1.6-signing.txt
          sha256sum MT-Food-v1.6-Crisp-signed.apk > MT-Food-v1.6.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MT-Food-v1.6-Crisp-signed
          path: |
            MT-Food-v1.6-Crisp-signed.apk
            MT-Food-v1.6-signing.txt
            MT-Food-v1.6.sha256

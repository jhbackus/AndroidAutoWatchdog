name: Build MT Food signed release

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        run: gradle assembleRelease --stacktrace

      - name: Restore permanent MT Food signing key
        env:
          MTFOOD_KEYSTORE_B64: ${{ secrets.MTFOOD_KEYSTORE_B64 }}
        run: |
          test -n "$MTFOOD_KEYSTORE_B64" || { echo 'Missing MTFOOD_KEYSTORE_B64 repository secret'; exit 1; }
          printf '%s' "$MTFOOD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mtfood-release.p12"

      - name: Sign and verify MT Food
        env:
          MTFOOD_KEYSTORE_PASSWORD: ${{ secrets.MTFOOD_KEYSTORE_PASSWORD }}
          MTFOOD_KEY_ALIAS: ${{ secrets.MTFOOD_KEY_ALIAS }}
          MTFOOD_KEY_PASSWORD: ${{ secrets.MTFOOD_KEY_PASSWORD }}
        run: |
          test -n "$MTFOOD_KEYSTORE_PASSWORD" || { echo 'Missing MTFOOD_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$MTFOOD_KEY_ALIAS" || { echo 'Missing MTFOOD_KEY_ALIAS'; exit 1; }
          test -n "$MTFOOD_KEY_PASSWORD" || { echo 'Missing MTFOOD_KEY_PASSWORD'; exit 1; }
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=MT-Food-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/mtfood-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$MTFOOD_KEY_ALIAS" \
            --ks-pass "pass:$MTFOOD_KEYSTORE_PASSWORD" \
            --key-pass "pass:$MTFOOD_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee MT-Food-signing-verification.txt
          sha256sum "$OUT" > MT-Food-release.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MT-Food-signed-release
          path: |
            MT-Food-release.apk
            MT-Food-release.sha256
            MT-Food-signing-verification.txt

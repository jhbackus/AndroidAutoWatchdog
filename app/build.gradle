                L(I("kipfilet","150 g p.p.",false),I("zoete aardappel","200 g p.p.",false),I("broccoli","120 g p.p.",false),I("sperziebonen","100 g p.p.",false),I("paprikapoeder","1 tl",true),I("olijfolie","1 tl p.p.",true)),

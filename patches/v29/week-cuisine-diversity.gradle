p=p.replace('''        Map<String,Integer> meatCounts=new HashMap<>();
        int fishCount=0;''','''        Map<String,Integer> meatCounts=new HashMap<>();
        int fishCount=0;
        Set<String> usedCuisines=new LinkedHashSet<>();''')

// In the main selection loop, do not reuse a cuisine while another feasible cuisine is available.
p=p.replace('''                if(isFishRecipe(r) && fishCount>=2) continue;

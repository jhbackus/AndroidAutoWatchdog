        recipes.add(new Recipe("oven-pasta","Volkoren pasta-ovenschotel met kip en spinazie","🧀","Pasta",35,"Makkelijke pasta-ovenschotel met kip, spinazie en tomatensaus.","balanced wholegrain protein vegetables chicken child oven",
                L(I("volkoren penne","85 g p.p.",false),I("kipfilet","120 g p.p.",false),I("spinazie","140 g p.p.",false),I("passata","150 ml p.p.",false),I("mozzarella light","35 g p.p.",false),I("basilicum","1 tl",true)),
                "Kook pasta 2 minuten korter dan op de verpakking.","Bak kip en spinazie en meng met passata en pasta.","Doe in een ovenschaal, verdeel mozzarella erover en gratineer 15 minuten."));
        recipes.add(new Recipe("oven-mex","Mexicaanse enchilada-ovenschotel","🌮","Anders",35,"Wraps uit de oven met kip, bonen, paprika, salsa en een beetje kaas.","balanced protein vegetables chicken legume child oven",
                L(I("volkoren wraps","2 p.p.",false),I("kipfilet","120 g p.p.",false),I("kidneybonen","70 g p.p.",false),I("paprika","100 g p.p.",false),I("salsa","60 g p.p.",false),I("geraspte kaas","25 g p.p.",false),I("Mexicaanse kruiden","1 tl p.p.",false)),
                "Bak kip, paprika en bonen met kruiden.","Vul de wraps en leg in een ovenschaal.","Bedek met salsa en kaas en bak 15–20 minuten op 200 °C."));
        recipes.add(new Recipe("steam-salmon","Stoomoven zalm met krieltjes, broccoli en citroen","💨🐟","AVG",30,"Zalm en groente deels gestoomd voor een sappig resultaat en weinig extra vet.","balanced med nordic heart skin menopause omega3 protein vegetables fish salmon steamoven",
                L(I("zalmfilet","150 g p.p.",false),I("krieltjes","220 g p.p.",false),I("broccoli","200 g p.p.",false),I("citroen","½",false),I("dille","1 bosje",false),I("magere yoghurt","40 g p.p.",false)),

name: Build MT Food signed release

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare MT Food v1.7 without Crisp
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          s=s.replace('versionCode 15', 'versionCode 17')
          s=s.replace("versionName '1.5.0'", "versionName '1.7.0'")
          s=s.replace('Koppeling en veilige praktijktest • v1.5', 'Koppeling en veilige praktijktest • v1.7')
          s=s.replace('// MT Food v1.5:', '// MT Food v1.7:')
          # Deliberately do not apply patches/v16/crisp.gradle. Crisp is disabled until
          # an official integration can actually add products to the Crisp cart.
          p.write_text(s)

      - name: Build unsigned release APK
        run: gradle assembleRelease --stacktrace

      - name: Restore fixed MT Food signing key
        env:
          GH_TOKEN: ${{ github.token }}
          MTFOOD_KEYSTORE_B64: ${{ secrets.MTFOOD_KEYSTORE_B64 }}
          MTFOOD_KEYSTORE_PASSWORD: ${{ secrets.MTFOOD_KEYSTORE_PASSWORD }}
          MTFOOD_KEY_ALIAS: ${{ secrets.MTFOOD_KEY_ALIAS }}
          MTFOOD_KEY_PASSWORD: ${{ secrets.MTFOOD_KEY_PASSWORD }}
        run: |
          if [ -n "$MTFOOD_KEYSTORE_B64" ]; then
            printf '%s' "$MTFOOD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mtfood-release.p12"
            printf '%s' "$MTFOOD_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks-pass"
            printf '%s' "$MTFOOD_KEY_PASSWORD" > "$RUNNER_TEMP/key-pass"
            printf '%s' "$MTFOOD_KEY_ALIAS" > "$RUNNER_TEMP/key-alias"
          else
            echo 'MTFOOD_* repository secrets not configured; using existing fixed trusted signing identity.'
            curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9477190082/zip -o signing.zip
            mkdir signing
            unzip -q signing.zip -d signing
            cp signing/android-auto-watchdog-release.p12 "$RUNNER_TEMP/mtfood-release.p12"
            PASS=$(cat signing/keystore-password.txt)
            printf '%s' "$PASS" > "$RUNNER_TEMP/ks-pass"
            printf '%s' "$PASS" > "$RUNNER_TEMP/key-pass"
            printf '%s' 'androidautowatchdog' > "$RUNNER_TEMP/key-alias"
          fi

      - name: Sign and verify MT Food
        run: |
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=MT-Food-v1.7-no-Crisp.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/mtfood-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$(cat "$RUNNER_TEMP/key-alias")" \
            --ks-pass "pass:$(cat "$RUNNER_TEMP/ks-pass")" \
            --key-pass "pass:$(cat "$RUNNER_TEMP/key-pass")" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee MT-Food-signing-verification.txt
          sha256sum "$OUT" > MT-Food-release.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MT-Food-v1.7-no-Crisp-signed
          path: |
            MT-Food-v1.7-no-Crisp.apk
            MT-Food-release.sha256
            MT-Food-signing-verification.txt
